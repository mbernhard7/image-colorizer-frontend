<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page not found</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: dark; }
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:#0a0c12; color:#e8ecf4;
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { text-align:center; padding:32px; }
  .code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
          font-size:13px; letter-spacing:.14em; color:#6b7484; margin:0 0 14px; }
  h1 { font-size:clamp(28px,5vw,40px); margin:0 0 12px; font-weight:700; letter-spacing:-.02em; }
  p.msg { color:#9aa4b5; margin:0 0 26px; font-size:15px; line-height:1.6; }
  a { display:inline-block; padding:10px 18px; border-radius:9px;
      border:1px solid rgba(255,255,255,.18); color:#e8ecf4;
      text-decoration:none; font-size:14px; }
  a:hover { border-color:rgba(255,255,255,.4); }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Page not found</h1>
  <p class="msg">That URL doesn't exist here.</p>
  <a href="/">Go home</a>
</main>
</body>
</html>
